name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests (pricing and fold logic)
        run: node --test test/logic.test.mjs

      - name: Locale keys used from client.js exist in both locales
        run: node scripts/check-locale-keys.mjs

      - name: Package contents (npm pack dry run)
        run: npm pack --dry-run
